{% extends 'base.html' %}
{% block title %}Aviso — AfinAR{% endblock %}

{% block content %}
<div class="page-container">
    <div class="error-page">
        <div class="error-icon">ℹ️</div>
        <h1 class="error-title">No fue posible completar la acción</h1>

        <div class="alert-error" style="text-align: center; margin: 0 auto 1.5rem; max-width: 480px;">
            {{ error }}
        </div>

        <a href="{{ url_for('catalogo') }}" class="btn-gold" style="display:inline-block;">
            ← Volver al catálogo
        </a>
    </div>
</div>
{% endblock %}
