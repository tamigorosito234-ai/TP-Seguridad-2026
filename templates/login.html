{% extends 'base.html' %}
{% block title %}Ingresar — AfinAR{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-text-afin">Afin</span><span class="logo-text-ar">AR</span><span class="logo-dot">.</span>
        </div>
        <h1 class="auth-title">Iniciar Sesión</h1>
        <p class="auth-sub">Ingresá a tu cuenta para gestionar pedidos y favoritos</p>

        {% if error %}
        <div class="alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username"
                       placeholder="tu_usuario" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-gold btn-full">Ingresar →</button>
        </form>
    </div>
</div>
{% endblock %}
